name: Docker Multi-Arch Build

on:
  workflow_run:
    workflows: ["Release (Create Tag)"]
    types:
      - completed

jobs:
  docker:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags

      - name: Resolve release tag
        id: tag
        run: |
          TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$TAG" ]; then
            echo "No release tag found"
            exit 1
          fi
          echo "VERSION=$TAG" >> $GITHUB_OUTPUT

      - name: Ensure tag is on main
        run: |
          git branch --contains "refs/tags/${{ steps.tag.outputs.VERSION }}" | grep "main" \
            || (echo "Tag is not on main branch" && exit 1)

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKER_IMAGE }}:${{ steps.tag.outputs.VERSION }}
            ${{ vars.DOCKER_IMAGE }}:latest

      # Best-effort: keep the Docker Hub README in sync with the repo README.
      # If this fails (Docker Hub API change, rate limit, transient outage)
      # we don't want to fail the whole release — the image push above is
      # what actually matters. continue-on-error makes the step advisory.
      - name: Update Docker Hub repository description
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE }}
        run: |
          set +e
          sudo apt-get update && sudo apt-get install -y jq

          # Docker Hub deprecated using a PAT directly as a Bearer token for
          # the repositories API. Exchange the PAT for a short-lived JWT
          # via /v2/users/login first, then use that JWT as Bearer.
          JWT_RESPONSE=$(curl -fsS -X POST \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$DOCKERHUB_USERNAME\",\"password\":\"$DOCKERHUB_TOKEN\"}" \
            https://hub.docker.com/v2/users/login)
          JWT=$(echo "$JWT_RESPONSE" | jq -r '.token // empty')
          if [ -z "$JWT" ]; then
            echo "::warning::Docker Hub login failed; skipping README sync. Response: $JWT_RESPONSE"
            exit 0
          fi
          echo "::add-mask::$JWT"

          DESCRIPTION=$(sed -n '3p' README.md)
          README_CONTENT=$(jq -Rs . < README.md)
          echo "Repository: $DOCKER_IMAGE"
          echo "Description: $DESCRIPTION"

          RESPONSE=$(curl -sS -X PATCH \
            -H "Authorization: Bearer $JWT" \
            -H "Content-Type: application/json" \
            -d "{\"description\": \"$DESCRIPTION\", \"full_description\": $README_CONTENT}" \
            "https://hub.docker.com/v2/repositories/$DOCKER_IMAGE/")

          if echo "$RESPONSE" | jq -e '.message' > /dev/null 2>&1; then
            echo "::warning::Docker Hub README sync failed: $(echo "$RESPONSE" | jq -r '.message')"
            exit 0
          fi
          echo "Docker Hub description updated successfully"
